[package]
name = "computer-use"
version = "0.1.0"
edition = "2021"
rust-version = "1.81"
license = "MIT OR Apache-2.0"
description = "Cross-platform desktop automation for agents: screenshots, mouse, keyboard, and accessibility."
repository = "https://github.com/lindoelio/computer-use"
homepage = "https://github.com/lindoelio/computer-use"
readme = "README.md"
keywords = ["computer-use", "automation", "gui", "agent", "screenshot"]
categories = [
    "command-line-utilities",
    "accessibility",
    "development-tools::testing",
]
authors = ["Lindoélio Lázaro"]
include = [
    "/src/**",
    "/tests/**",
    "/Cargo.toml",
    "/Cargo.lock",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE-MIT",
    "/LICENSE-APACHE",
]

[lib]
name = "computer_use"
path = "src/lib.rs"

[[bin]]
name = "computer-use"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
enigo = "0.3.0"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
xcap = "0.3.3"

[profile.release]
lto = "thin"
strip = true
