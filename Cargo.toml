[package]
name = "computer-use"
version = "0.1.0"
edition = "2021"
rust-version = "1.91"
license = "MIT OR Apache-2.0"
description = "Cross-platform desktop automation for agents: screenshots, mouse, keyboard, and accessibility."
repository = "https://github.com/lindoelio/computer-use"
homepage = "https://github.com/lindoelio/computer-use"
readme = "README.md"
keywords = ["computer-use", "automation", "gui", "agent", "screenshot"]
categories = [
    "command-line-utilities",
    "accessibility",
    "development-tools::testing",
]
authors = ["Lindoélio Lázaro"]
include = [
    "/src/**",
    "/tests/**",
    "/Cargo.toml",
    "/Cargo.lock",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE-MIT",
    "/LICENSE-APACHE",
]

[lib]
name = "computer_use"
path = "src/lib.rs"

[[bin]]
name = "computer-use"
path = "src/main.rs"

[features]
default = []
# Crate dependencies are attached in the phase that uses them.
# P1 declares the names so `--all-features` compiles on every OS.
# P10: `cdp` pulls chromiumoxide and a minimal tokio for CDP attach.
cdp = ["dep:chromiumoxide", "dep:tokio", "dep:futures"]
skylight = []
virtual-display = ["skylight"]
portal = []

[dependencies]
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
enigo = "0.3.0"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
serde = { version = "1", features = ["derive"] }
dirs = "6"
serde_json = "1"
thiserror = "2"
toml = "0.8.23"
xcap = "0.3.3"
# P10: optional CDP client (attach only, never to spawn). Pinned to 0.9.1 per the
# ROADMAP.md design.
chromiumoxide = { version = "0.9.1", optional = true, default-features = false }
# We create a `current_thread` runtime per call (P10 design). `macros` is unused
# here but chromiumoxide itself needs `net`, `time`, etc.; cargo feature
# unification picks those up from chromiumoxide's own deps.
tokio = { version = "1", optional = true, default-features = false, features = [
    "rt",
] }
# `chromiumoxide`'s handler is a `futures::Stream`; we only use `StreamExt`
# to drive it inside our short-lived runtime.
futures = { version = "0.3", optional = true, default-features = false, features = [
    "std",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# macOS and Windows pasteboards do not use the Wayland feature.
[target.'cfg(not(target_os = "linux"))'.dependencies]
arboard = "3.7.0"

# Default features pull `wayland-data-control`. X11 plus image data is enough.
[target.'cfg(target_os = "linux")'.dependencies]
arboard = { version = "3.7.0", default-features = false, features = ["image-data"] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
    "NSApplication",
    "NSBezierPath",
    "NSColor",
    "NSGraphics",
    "NSResponder",
    "NSRunningApplication",
    "NSScreen",
    "NSView",
    "NSWindow",
    "NSWorkspace",
    "block2",
    "objc2-core-foundation",
] }
objc2-application-services = { version = "0.3.2", default-features = false, features = [
    "AXError",
    "AXUIElement",
    "AXValue",
    "HIServices",
    "libc",
] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = [
    "CFArray",
    "CFBase",
    "CFCGTypes",
    "CFDate",
    "CFDictionary",
    "CFNumber",
    "CFMachPort",
    "CFRunLoop",
    "CFString",
    "CFURL",
] }
objc2-core-graphics = { version = "0.3.2", default-features = false, features = [
    "CGBitmapContext",
    "CGColorSpace",
    "CGContext",
    "CGDirectDisplay",
    "CGDisplayConfiguration",
    "CGError",
    "CGEvent",
    "CGEventSource",
    "CGEventTypes",
    "CGRemoteOperation",
    "CGGeometry",
    "CGImage",
    "CGSession",
    "CGWindow",
    "libc",
] }
objc2-core-media = { version = "0.3.2", default-features = false, features = [
    "CMSampleBuffer",
] }
dispatch2 = "0.3"
objc2-foundation = { version = "0.3.2", default-features = false, features = [
    "NSArray",
    "NSBundle",
    "NSData",
    "NSDictionary",
    "NSError",
    "NSObject",
    "NSProcessInfo",
    "NSString",
    "NSURL",
] }
objc2-screen-capture-kit = { version = "0.3.2", default-features = false, features = [
    "SCError",
    "SCScreenshotManager",
    "SCShareableContent",
    "SCStream",
    "block2",
    "dispatch2",
    "libc",
    "objc2-core-foundation",
    "objc2-core-graphics",
    "objc2-core-media",
] }
# P11: VNRecognizeTextRequest (accurate + language correction) for OCR.
objc2-vision = { version = "0.3.2", default-features = false, features = [
    "VNRecognizeTextRequest",
    "VNRequest",
    "VNRequestHandler",
    "VNObservation",
    "VNTypes",
    "objc2-core-foundation",
] }

[profile.release]
lto = "thin"
strip = true
