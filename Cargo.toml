[package]
name = "computer-use"
version = "0.1.0"
edition = "2021"
rust-version = "1.91"
license = "MIT OR Apache-2.0"
description = "Cross-platform desktop automation for agents: screenshots, mouse, keyboard, and accessibility."
repository = "https://github.com/lindoelio/computer-use"
homepage = "https://github.com/lindoelio/computer-use"
readme = "README.md"
keywords = ["computer-use", "automation", "gui", "agent", "screenshot"]
categories = [
    "command-line-utilities",
    "accessibility",
    "development-tools::testing",
]
authors = ["Lindoélio Lázaro"]
include = [
    "/src/**",
    "/tests/**",
    "/Cargo.toml",
    "/Cargo.lock",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE-MIT",
    "/LICENSE-APACHE",
]

[lib]
name = "computer_use"
path = "src/lib.rs"

[[bin]]
name = "computer-use"
path = "src/main.rs"

[features]
default = []
# Crate dependencies are attached in the phase that uses them.
# P1 declares the names so `--all-features` compiles on every OS.
cdp = []
skylight = []
virtual-display = ["skylight"]
portal = []

[dependencies]
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
enigo = "0.3.0"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
serde = { version = "1", features = ["derive"] }
dirs = "6"
serde_json = "1"
thiserror = "2"
xcap = "0.3.3"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
    "NSRunningApplication",
    "NSScreen",
    "NSWorkspace",
    "block2",
    "objc2-core-foundation",
] }
objc2-application-services = { version = "0.3.2", default-features = false, features = [
    "AXError",
    "AXUIElement",
    "AXValue",
    "HIServices",
    "libc",
] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = [
    "CFArray",
    "CFBase",
    "CFCGTypes",
    "CFDate",
    "CFDictionary",
    "CFNumber",
    "CFRunLoop",
    "CFString",
    "CFURL",
] }
objc2-core-graphics = { version = "0.3.2", default-features = false, features = [
    "CGBitmapContext",
    "CGColorSpace",
    "CGContext",
    "CGGeometry",
    "CGImage",
    "CGWindow",
] }
objc2-core-media = { version = "0.3.2", default-features = false, features = [
    "CMSampleBuffer",
] }
dispatch2 = "0.3"
objc2-foundation = { version = "0.3.2", default-features = false, features = [
    "NSArray",
    "NSBundle",
    "NSError",
    "NSProcessInfo",
    "NSString",
    "NSURL",
] }
objc2-screen-capture-kit = { version = "0.3.2", default-features = false, features = [
    "SCError",
    "SCScreenshotManager",
    "SCShareableContent",
    "SCStream",
    "block2",
    "dispatch2",
    "libc",
    "objc2-core-foundation",
    "objc2-core-graphics",
    "objc2-core-media",
] }

[profile.release]
lto = "thin"
strip = true
