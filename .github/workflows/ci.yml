name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  cdp-live:
    name: cdp-live (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux build dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libxdo-dev libx11-dev libxcb1-dev \
            libxrandr-dev libdbus-1-dev libxkbcommon-dev libatspi2.0-dev \
            libclang-dev clang
      - name: Install Chrome for Testing
        id: chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable
      - name: Point the tests at Chrome
        shell: bash
        run: echo "CHROME_BIN=${{ steps.chrome.outputs.chrome-path }}" >> "$GITHUB_ENV"
      - name: Live CDP tests
        run: cargo test --features cdp --test cdp_live -- --test-threads=1

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux build dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          # P13b: libpipewire-0.3-dev is the `portal` feature's system library;
          # pipewire-sys and libspa-sys run bindgen against its headers, so
          # libclang-dev/clang must be present whenever `--all-features` turns
          # the feature on below.
          sudo apt-get install -y pkg-config libxdo-dev libx11-dev libxcb1-dev libxrandr-dev libdbus-1-dev libxkbcommon-dev libatspi2.0-dev libpipewire-0.3-dev libclang-dev clang shellcheck
      - name: Check packaging script
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/package-macos-app.sh
          bash -n scripts/check-macos-app-status.sh
          if command -v shellcheck >/dev/null 2>&1; then
            shellcheck scripts/package-macos-app.sh
            shellcheck scripts/check-macos-app-status.sh
          fi
      - name: Check the release guard script
        shell: bash
        run: |
          set -euo pipefail
          tmp=$(mktemp -d)
          guard=scripts/check-macos-app-status.sh
          # Ad-hoc only: refused unless the pre-release override is set.
          touch "${tmp}/computer-use-macos-arm64-app-unsigned.zip"
          printf 'signed=adhoc\nnotarized=no\n' > "${tmp}/computer-use-macos-app-status.txt"
          if "${guard}" "${tmp}"; then
            echo "an ad-hoc bundle must fail the tag guard" >&2
            exit 1
          fi
          ALLOW_UNSIGNED_RELEASE=1 "${guard}" "${tmp}"
          # Developer ID signed but not notarized: still refused.
          rm "${tmp}/computer-use-macos-arm64-app-unsigned.zip"
          touch "${tmp}/computer-use-macos-arm64-app.zip"
          printf 'signed=developer-id\nnotarized=no\n' > "${tmp}/computer-use-macos-app-status.txt"
          if "${guard}" "${tmp}"; then
            echo "a signed but un-notarized bundle must fail the tag guard" >&2
            exit 1
          fi
          # Signed and notarized: accepted.
          printf 'signed=developer-id\nnotarized=yes\n' > "${tmp}/computer-use-macos-app-status.txt"
          "${guard}" "${tmp}"
          # No macOS app at all: refused.
          rm "${tmp}/computer-use-macos-arm64-app.zip"
          if "${guard}" "${tmp}"; then
            echo "a tag without a macOS app must fail the guard" >&2
            exit 1
          fi
          echo "release guard script ok"
          rm -rf "${tmp}"
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Check the portal feature builds
        # `--all-features` only builds `portal` on Linux (the deps are
        # Linux-gated), so this is the explicit P13b compile gate. It links
        # PipeWire and never contacts a portal daemon.
        if: matrix.os == 'ubuntu-latest'
        run: cargo check --features portal --all-targets
      - name: Check the default feature set builds
        # The published crate is built with the default features, so that set
        # has to compile on every platform. An `--all-features` build cannot
        # catch a branch that only the default build takes.
        run: cargo check --all-targets
      - name: Test the default feature set
        # The portal helpers are compiled out here, and their unit tests are
        # written to run without PipeWire or a portal daemon. On Linux the
        # default build is the one that differs from the tested build.
        if: matrix.os == 'ubuntu-latest'
        run: cargo test --all-targets
      - name: Test
        run: cargo test --all-targets --all-features
      - name: Package ad-hoc Computer Use.app
        if: success() && matrix.os == 'macos-latest'
        shell: bash
        run: |
          set -euo pipefail
          test -x target/debug/computer-use
          tmp=$(mktemp -d)
          scripts/package-macos-app.sh target/debug/computer-use "${tmp}"
          app="${tmp}/Computer Use.app"
          test -x "${app}/Contents/MacOS/computer-use"
          test -f "${app}/Contents/Info.plist"
          test -d "${app}/Contents/Resources"
          codesign --verify --verbose=2 "${app}"
          plutil -lint "${app}/Contents/Info.plist"
          plutil -lint packaging/macos/Info.plist
          plutil -lint packaging/macos/entitlements.plist
          ident=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "${app}/Contents/Info.plist")
          test "${ident}" = "ai.lindoelio.computer-use"
          version=$(sed -n '1,/^\[dependencies\]/s/^version = "\([^"]*\)"/\1/p' Cargo.toml)
          version=${version%%$'\n'*}
          short=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "${app}/Contents/Info.plist")
          test "${short}" = "${version}"
          "${app}/Contents/MacOS/computer-use" doctor > "${tmp}/doctor.json"
          python3 -c 'import json,sys; report=json.load(open(sys.argv[1])); assert report["ok"] is True; assert report["bundle_id"]=="ai.lindoelio.computer-use"; assert report["identity"]["bundled"] is True; assert report["identity"]["bundle_id"]=="ai.lindoelio.computer-use"' "${tmp}/doctor.json"

  coverage:
    name: coverage (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            coverage_os: macos
            enforce: "1"
          - os: ubuntu-latest
            coverage_os: linux
            enforce: "0"
          - os: windows-latest
            coverage_os: windows
            enforce: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux build dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libxdo-dev libx11-dev libxcb1-dev \
            libxrandr-dev libdbus-1-dev libxkbcommon-dev libatspi2.0-dev \
            libpipewire-0.3-dev libclang-dev clang
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: Install Chrome for Testing
        id: chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable
      - name: Point the tests at Chrome
        shell: bash
        run: echo "CHROME_BIN=${{ steps.chrome.outputs.chrome-path }}" >> "$GITHUB_ENV"
      - name: Measure line coverage
        shell: bash
        run: cargo llvm-cov --all-targets --all-features --json --output-path cov.json
      - name: Enforce the floor
        if: matrix.enforce == '1'
        shell: bash
        run: |
          set -euo pipefail
          py=python3
          command -v python3 >/dev/null 2>&1 || py=python
          "$py" scripts/coverage-gate.py cov.json --os ${{ matrix.coverage_os }}
      - name: Report the floor
        if: matrix.enforce != '1'
        shell: bash
        run: |
          set -euo pipefail
          py=python3
          command -v python3 >/dev/null 2>&1 || py=python
          "$py" scripts/coverage-gate.py cov.json --os ${{ matrix.coverage_os }} --mode report
