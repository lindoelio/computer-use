# Example policy for computer-use. Copy to ~/.config/computer-use/policy.toml.
# A missing file allows ordinary apps and still applies the built-in deny list.
# Leave `default` commented. `default = "deny"` refuses every app that is not allowed.

version = 1
# default = "allow"

# Install a listen-only event tap and pause mutating actions on real local input.
# Absent or false does not create a tap. `computer-use resume` clears the pause.
# pause_on_user_input = true

# [[allow]]
# bundle_id = "com.apple.Notes"

# [[allow]]
# bundle_id = "com.apple.Safari"
# path = "/System/Volumes/Preboot/Cryptexes/App/System/Applications/Safari.app"

# [[deny]]
# bundle_id = "com.example.Untrusted"

# [confirm]
# command = "/usr/local/bin/computer-use-confirm"
# timeout_secs = 30

# [browser]
# blocked_urls = ["https://accounts.example.com/*", "file://*"]

# Focused-element guard for text-inserting actions without --element.
# secure_focus: "deny" refuses a secure focused field, "warn" proceeds with a warning.
# unreadable_focus: "warn" proceeds with a warning when focus cannot be read, "deny" refuses.
# [security]
# secure_focus = "deny"
# unreadable_focus = "warn"

# Audit rotation. max_bytes rotates audit.jsonl into numbered backups at that
# size (minimum 1024; COMPUTER_USE_AUDIT_MAX_BYTES can raise it). keep is the
# number of backups, clamped to 1..=5.
# [audit]
# enabled = true
# max_bytes = 10485760
# keep = 1

# Window moves and resizes are clamped to the display that contains the
# requested center unless clamp is false.
# [window]
# clamp = true
